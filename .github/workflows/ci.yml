name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Real keys are optional here: repo secrets are used when configured,
      # otherwise safe placeholders — the app is demo-mode-first and must
      # build without any live credentials.
      - run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan full history, not just the merge commit
      # Raw binary instead of gitleaks-action: the action needs PR-read API
      # access the default workflow token doesn't have, and the binary scan
      # of full git history is all we actually want.
      - name: Scan full git history with gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          /tmp/gitleaks git --no-banner --redact --exit-code 1 .

  env-hygiene:
    name: Env-file and key hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No real env files tracked
        run: |
          tracked=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -v '^\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Real env files must never be committed:"
            echo "$tracked"
            exit 1
          fi
      - name: No known key patterns in tracked files
        run: |
          hits=$(git grep -nIE 'sk-or-v1-[A-Za-z0-9]{16,}|sb_secret_[A-Za-z0-9_-]{8,}|-----BEGIN (RSA |EC )?PRIVATE KEY-----|eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJpc3Mi' -- . ':!package-lock.json' || true)
          if [ -n "$hits" ]; then
            echo "::error::Possible secret material found in tracked files:"
            echo "$hits"
            exit 1
          fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Warn on high-severity advisories (non-blocking)
        run: npm audit --audit-level=high || echo "::warning::High-severity advisories present — run 'npm audit' locally and review."
      - name: Block on critical advisories
        run: npm audit --audit-level=critical
